<main id="contenido" class="container my-5" tabindex="-1">

<h1 class="text-center mb-4">Formulario de Contacto</h1>

<div class="alert alert-info" role="note">
<strong>Formulario de demostración.</strong> Forma parte de un proyecto académico y no envía ningún dato.
</div>

<form id="formulario">

<div class="row mb-3">
<div class="col-md-6">
<label for="nombre" class="form-label">Nombre:</label>
<input type="text" id="nombre" class="form-control" required autocomplete="given-name">
</div>

<div class="col-md-6">
<label for="apellido" class="form-label">Apellido:</label>
<input type="text" id="apellido" class="form-control" required autocomplete="family-name">
</div>
</div>

<div class="mb-3">
<label for="email" class="form-label">Correo electrónico:</label>
<input type="email" id="email" class="form-control" required autocomplete="email">
</div>

<div class="mb-3">
<label for="telefono" class="form-label">Teléfono:</label>
<input type="tel" id="telefono" class="form-control" required autocomplete="tel">
</div>

<div class="mb-3">
<label for="motivo" class="form-label">Escribí tu consulta:</label>
<textarea id="motivo" class="form-control" rows="4" required></textarea>
</div>

<div class="text-center">
<button type="submit" class="btn btn-success btn-lg">
Reservar clase <span aria-hidden="true">🇧🇷</span>
</button>
</div>

<p id="estado" class="text-center mt-3" role="status"></p>

</form>

</main>

<footer class="bg-dark text-white text-center py-4">
<p class="mb-0">© 2026 Mariano Yuffa · Proyecto académico</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
document.getElementById('formulario').addEventListener('submit', function (evento) {
    evento.preventDefault();
    document.getElementById('estado').textContent =
        'Gracias por probar el formulario. Es una demostración: no se envió ningún dato.';
    this.reset();
});
</script>
</body>
