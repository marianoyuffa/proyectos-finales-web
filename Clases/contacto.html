<main id="contenido" class="container my-5">

<h1 class="text-center mb-4">Formulario de Contacto</h1>

<form>

<div class="row mb-3">
<div class="col-md-6">
<label for="nombre" class="form-label">Nombre:</label>
<input type="text" id="nombre" class="form-control" required autocomplete="given-name">
</div>

<div class="col-md-6">
<label for="apellido" class="form-label">Apellido:</label>
<input type="text" id="apellido" class="form-control" required autocomplete="family-name">
</div>
</div>

<div class="mb-3">
<label for="genero" class="form-label">Género</label>
<select id="genero" class="form-select" required>
<option value="">Seleccione una opción</option>
<option>Mujer</option>
<option>Hombre</option>
</select>
</div>

<div class="mb-3">
<label for="email" class="form-label">Correo electrónico:</label>
<input type="email" id="email" class="form-control" required autocomplete="email">
</div>

<div class="mb-3">
<label for="telefono" class="form-label">Teléfono:</label>
<input type="tel" id="telefono" class="form-control" required autocomplete="tel">
</div>

<div class="mb-3">
<label for="motivo" class="form-label">escríbeme tu consulta:</label>
<textarea id="motivo" class="form-control" rows="4" required></textarea>
</div>

<div class="text-center">
<button type="submit" class="btn btn-success btn-lg">
Reservar clase 🇧🇷
</button>
</div>

</form>

</main>
